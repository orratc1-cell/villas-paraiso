  <title>Villas Paraíso – Fantino, Sánchez Ramírez</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Lora',Georgia,serif;background:#0a1628;color:#f0ede6;min-height:100vh;}
    .D{font-family:'Abril Fatface',Georgia,serif;}
    nav{background:#071020;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;border-bottom:1px solid #162848;}
    .logo{display:flex;align-items:center;gap:8px;cursor:pointer;}
    .logo-title{color:#5bb8f5;font-family:'Abril Fatface',Georgia,serif;font-size:1rem;line-height:1.1;}
    .logo-sub{color:#1060a0;font-size:0.55rem;letter-spacing:0.2em;text-transform:uppercase;}
    .nav-links{display:flex;gap:18px;align-items:center;}
    .nav-link{cursor:pointer;font-size:0.78rem;letter-spacing:0.18em;text-transform:uppercase;transition:color 0.2s;padding:4px 0;border-bottom:1.5px solid transparent;color:#60c0f0;}

    .btn-blue{background:#2196d3;color:#fff;border:none;padding:13px 32px;font-family:'Lora',Georgia,serif;font-size:0.95rem;cursor:pointer;transition:background 0.2s,transform 0.15s;border-radius:2px;}
    .btn-blue:hover{background:#1a7ab8;transform:translateY(-2px);}
    .btn-outline{background:transparent;color:#5bb8f5;border:1.5px solid #5bb8f5;padding:11px 24px;font-family:'Lora',Georgia,serif;font-size:0.88rem;cursor:pointer;transition:all 0.2s;border-radius:2px;}
    .btn-outline:hover{background:#5bb8f5;color:#0a1628;}
    .btn-wa{background:#25D366;color:#fff;border:none;padding:13px 24px;font-family:'Lora',Georgia,serif;font-size:0.95rem;cursor:pointer;display:inline-flex;align-items:center;gap:10px;border-radius:2px;transition:background 0.2s;text-decoration:none;}
    .btn-wa:hover{background:#1da851;}
    .hero{position:relative;height:100vh;overflow:hidden;background:#0a1e3a;}
    .hero img{width:100%;height:100%;object-fit:contain;object-position:center center;filter:brightness(0.92);}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,16,32,0.05),rgba(10,22,40,0.55));}
    .hero-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;}
    .hero h1{font-family:'Abril Fatface',Georgia,serif;font-size:clamp(2.6rem,8vw,4.8rem);color:#fff;line-height:1.05;margin-bottom:18px;text-shadow:0 2px 20px rgba(0,0,0,0.5);}
    .hero p{color:#b8e4ff;font-size:1.1rem;max-width:500px;line-height:1.7;margin-bottom:34px;font-style:italic;}
    .hero-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
    section{padding:64px 20px;}
    .container{max-width:880px;margin:0 auto;}
    .section-header{text-align:center;margin-bottom:44px;}
    .section-header h2{font-family:'Abril Fatface',Georgia,serif;font-size:2.2rem;color:#b8e4ff;margin-bottom:10px;}
    .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;}
    .grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
